name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'TharindaMarasingha' }}
    steps:
      - name: Check registry token
        env:
          TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::REGISTRY_ACCESS_TOKEN is empty or not visible to this workflow. Add it under Settings > Secrets and variables > Actions > Repository secrets (not Environment / Codespaces / Dependabot)."
            exit 1
          fi
          echo "::notice::REGISTRY_ACCESS_TOKEN found (length ${#TOKEN})"
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
